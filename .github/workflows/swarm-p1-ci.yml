# ============================================================================
# Swarm P1 CI（WP1.6）：C++ 单元测试 + 评测集自检 + 场景库自检 + 感知服务
# 守护 Swarm 集群扩展的可测部分；完整 QGC 构建见官方 CI / deploy/docker。
# 路径已适配合并后的结构：扩展辅助资产在 swarm_ext/，C++ 模块在 src/Swarm/。
# ============================================================================
name: swarm-p1-ci

permissions:
  contents: read

on:
  push:
    paths:
      - "src/Swarm/**"
      - "src/FlyView/Swarm*.qml"
      - "test/Swarm/**"
      - "src/MissionManager/**"
      - "src/FirmwarePlugin/**"
      - "src/QmlControls/RCToParam*"
      - "test/QmlControls/RCToParam*"
      - "swarm_ext/**"
      - ".github/workflows/swarm-p1-ci.yml"
  pull_request:
    paths:
      - "src/Swarm/**"
      - "src/FlyView/Swarm*.qml"
      - "test/Swarm/**"
      - "src/MissionManager/**"
      - "src/FirmwarePlugin/**"
      - "src/QmlControls/RCToParam*"
      - "test/QmlControls/RCToParam*"
      - "swarm_ext/**"
      - ".github/workflows/swarm-p1-ci.yml"

jobs:
  cpp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 安装 Qt6 与构建工具
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake build-essential qt6-base-dev qt6-declarative-dev qt6-positioning-dev
      - name: 构建 P1/P2/P3 模块单元测试
        run: cmake -S swarm_ext/tests/cpp -B swarm_ext/tests/cpp/build -DCMAKE_BUILD_TYPE=Release
             && cmake --build swarm_ext/tests/cpp/build -j2
      - name: 运行单元测试
        run: ctest --test-dir swarm_ext/tests/cpp/build --output-on-failure

  llm-eval-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: 语法检查
        run: python3 -m py_compile swarm_ext/tests/llm_eval/*.py swarm_ext/sim/run_scenario.py
      - name: 工具 Schema 提取（从 src/Swarm/SwarmAIAgent.cc 单源一致）
        run: cd swarm_ext/tests/llm_eval && python3 export_tools.py
      - name: 数据集生成确定性（两次生成必须一致，≥500 条）
        run: |
          cd swarm_ext/tests/llm_eval
          python3 generate_dataset.py /tmp/d1.jsonl
          python3 generate_dataset.py /tmp/d2.jsonl
          diff /tmp/d1.jsonl /tmp/d2.jsonl
          test "$(wc -l < /tmp/d1.jsonl)" -ge 500
      - name: 数据集与工具 Schema 一致性校验
        run: cd swarm_ext/tests/llm_eval && python3 run_eval.py --dry-run

  scenario-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: 场景 JSON 合法性与 dry-run
        run: |
          for f in swarm_ext/sim/scenarios/*.json; do
            python3 -c "import json; json.load(open('$f'))" || exit 1
            python3 swarm_ext/sim/run_scenario.py "$f" --dry-run || exit 1
          done

  perception-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: 安装科学计算依赖
        run: pip install --quiet numpy scipy
      - name: 感知服务单元测试（编解码/几何互逆/跟踪稳定/端到端）
        run: python3 swarm_ext/services/perception/test_perception.py
      - name: 感知协议故障与跨语言契约
        run: python3 -m unittest discover -s swarm_ext/services/perception -p test_protocol.py -v
      - name: 场景 06 端到端馈送（离线文件模式）
        run: python3 swarm_ext/services/perception/service.py
             --scenario swarm_ext/sim/scenarios/06_perception_feed.json
             --out file:///tmp/ci_tracks.jsonl --quiet
      - name: 方言 XML 良构校验
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('swarm_ext/mavlink/swarm_perception.xml'); print('dialect XML OK')"
